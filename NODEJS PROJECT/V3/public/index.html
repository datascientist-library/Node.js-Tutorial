<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Support Ticket System Demo</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 600px; margin: 20px auto; padding: 0 20px; }
        .hidden { display: none; }
        .section { border: 1px solid #ccc; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        #chat-box { height: 300px; border: 1px solid #eee; overflow-y: auto; padding: 10px; margin-bottom: 10px; background: #fafafa; }
        .message { margin-bottom: 10px; padding: 8px; border-radius: 4px; background: #e9ecef; }
        .my-message { background: #007bff; color: white; text-align: right; }
        input, button { padding: 8px; margin: 4px 0; }
        button { cursor: pointer; background: #333; color: white; border: none; border-radius: 4px; }
    </style>
</head>
<body>

    <h2>Support Ticket Portal</h2>

    <!-- AUTHENTICATION SECTION -->
    <div id="auth-section" class="section">
        <h3>Login / Register</h3>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <select id="role">
            <option value="user">Customer</option>
            <option value="agent">Support Agent</option>
        </select>
        <br>
        <button onclick="auth('login')">Login</button>
        <button onclick="auth('register')">Register</button>
        <p id="auth-status" style="color: red;"></p>
    </div>

    <!-- TICKET MANAGEMENT SECTION -->
    <div id="ticket-section" class="section hidden">
        <h3>Tickets</h3>
        <p>Logged in as: <strong id="display-user"></strong></p>
        
        <div style="margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid #eee;">
            <h4>Create New Ticket</h4>
            <input type="text" id="ticket-title" placeholder="Issue description...">
            <button onclick="createTicket()">Create Ticket</button>
            <p id="new-ticket-id" style="color: green; font-weight: bold;"></p>
        </div>

        <div>
            <h4>Join Existing Ticket</h4>
            <input type="text" id="join-ticket-id" placeholder="Paste Ticket ID here">
            <button onclick="joinTicket()">Join Chat</button>
        </div>
    </div>

    <!-- LIVE CHAT SECTION -->
    <div id="chat-section" class="section hidden">
        <h3>Live Chat (Ticket: <span id="current-ticket"></span>)</h3>
        <div id="chat-box"></div>
        <input type="text" id="message-input" placeholder="Type a message..." style="width: 70%;">
        <button onclick="sendMessage()">Send</button>
    </div>

    <!-- Load Socket.io client directly from the Node server -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        let token = '';
        let userId = '';
        let currentTicketId = '';
        const socket = io(); // Automatically connects to the host serving the page


        // REST API Calls (Fetch)
        async function auth(action) {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;

            const res = await fetch(`/${action}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password, role })
            });

            const data = await res.json();
            
            if (action === 'register') {
                document.getElementById('auth-status').innerText = 'Registered! Now click Login.';
            } else if (res.ok) {
                token = data.token;
                userId = data.userId;
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('ticket-section').classList.remove('hidden');
                document.getElementById('display-user').innerText = `${username} (${data.role})`;
            } else {
                document.getElementById('auth-status').innerText = data.error;
            }
        }

        async function createTicket() {
            const title = document.getElementById('ticket-title').value;
            const res = await fetch('/tickets', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}` 
                },
                body: JSON.stringify({ title })
            });
            const data = await res.json();
            document.getElementById('new-ticket-id').innerText = `Created! Ticket ID: ${data._id}`;
            document.getElementById('join-ticket-id').value = data._id; // Auto-fill for convenience
        }

        async function joinTicket() {
            currentTicketId = document.getElementById('join-ticket-id').value;
            if (!currentTicketId) return alert('Enter a ticket ID');

            // Fetch History via REST
            const res = await fetch(`/tickets/${currentTicketId}/history`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const history = await res.json();
            
            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML = ''; // Clear box
            history.forEach(msg => appendMessage(msg));

            // Connect to Live Socket Room
            socket.emit('joinTicket', currentTicketId);
            
            document.getElementById('ticket-section').classList.add('hidden');
            document.getElementById('chat-section').classList.remove('hidden');
            document.getElementById('current-ticket').innerText = currentTicketId;
        }

        // WebSockets (Live Chat)
        function sendMessage() {
            const content = document.getElementById('message-input').value;
            if (!content) return;

            socket.emit('sendMessage', {
                ticketId: currentTicketId,
                senderId: userId,
                content: content
            });
            
            document.getElementById('message-input').value = '';
        }

        socket.on('newMessage', (message) => {
            appendMessage(message);
        });

        function appendMessage(message) {
            const chatBox = document.getElementById('chat-box');
            const div = document.createElement('div');
            const isMe = message.sender._id === userId;
            
            div.className = `message ${isMe ? 'my-message' : ''}`;
            div.innerHTML = `<strong>${message.sender.username}</strong>: ${message.content}`;
            
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight; // Auto-scroll to bottom
        }
    </script>
</body>
</html>
